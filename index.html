<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Royal Purple Bloom For You 🌸✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;600&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #05030a;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(5, 2, 12, 0.85) 100%);
        }

        .interface-layer {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            font-family: 'Playfair Display', serif;
        }

        #main-message {
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.5s ease;
            transform: translateY(15px);
            padding: 0 20px;
        }

        #main-message h1 {
            font-size: 2.6rem;
            margin: 0 0 12px 0;
            color: #e879f9;
            text-shadow: 0 0 20px rgba(217, 70, 239, 0.8), 0 0 40px rgba(168, 85, 247, 0.5);
        }

        #main-message p {
            font-size: 1.3rem;
            margin: 0;
            color: #f3e8ff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .revealed {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 3, 10, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        #start-btn {
            background: linear-gradient(135deg, #a855f7, #c084fc);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(168, 85, 247, 0.6);
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 15px 45px rgba(168, 85, 247, 0.8);
        }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 20px;
            padding: 12px 26px;
            color: rgba(243, 232, 255, 0.95);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-align: center;
            pointer-events: none;
        }
        .instructions span {
            color: #c084fc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="vignette"></div>

        <!-- Audio Element -->
        <audio id="bg-music" preload="auto" loop>
            <source src="golden_brown_slowed.mp3" type="audio/mpeg">
        </audio>

        <!-- UI Overlay Layer -->
        <div class="interface-layer">
            <div id="main-message">
                <h1>Thank you for being the best girlfriend in the world 💜✨</h1>
                <p>Happy Girlfriend's Day, my princess! 🌸💍</p>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instructions">
            <span>Left hand pinch</span> controls Bloom &nbsp;·&nbsp;
            <span>Right hand pinch</span> controls Growth &nbsp;·&nbsp;
            <span>Sway hands</span> for wind
        </div>

        <!-- Start Screen -->
        <div id="start-overlay">
            <button id="start-btn">A Royal Purple Bloom For You 💜 (Click to Begin)</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        class OrganicNoise {
            constructor() {
                this.seeds = Array.from({ length: 8 }, () => Math.random() * 1000);
            }
            get(t, channel = 0) {
                const s = this.seeds[channel % this.seeds.length];
                return (
                    Math.sin(t * 0.7 + s) * 0.4 +
                    Math.sin(t * 1.3 + s * 1.7) * 0.3 +
                    Math.sin(t * 2.1 + s * 0.3) * 0.2 +
                    Math.sin(t * 3.7 + s * 2.1) * 0.1
                );
            }
        }

        class Particle {
            constructor(cw, ch) {
                this.cw = cw;
                this.ch = ch;
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * this.cw;
                this.y = initial ? Math.random() * this.ch : this.ch + Math.random() * 40;
                this.radius = Math.random() * 3 + 0.8;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = -(Math.random() * 0.8 + 0.2);
                this.life = Math.random() * 300 + 150;
                this.maxLife = this.life;
                this.hue = 270 + Math.random() * 40;
                this.brightness = 75 + Math.random() * 25;
                this.flickerPhase = Math.random() * Math.PI * 2;
            }
            update(windForce, dt) {
                this.x += this.vx + windForce * 2.0;
                this.y += this.vy;
                this.life -= dt;
                if (this.life <= 0 || this.y < -20 || this.x < -20 || this.x > this.cw + 20) {
                    this.reset();
                }
            }
            draw(ctx) {
                const t = this.life / this.maxLife;
                const flicker = 0.5 + 0.5 * Math.sin(this.life * 0.1 + this.flickerPhase);
                const alpha = t * 0.85 * flicker;
                if (alpha < 0.02) return;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 18;
                ctx.shadowColor = `hsla(${this.hue}, 100%, ${this.brightness}%, 1)`;
                ctx.fillStyle = `hsla(${this.hue}, 95%, ${this.brightness}%, 1)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FlowerBloomApp {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.video = document.getElementById('webcam');
                this.startOverlay = document.getElementById('start-overlay');
                this.startBtn = document.getElementById('start-btn');
                this.music = document.getElementById('bg-music');
                this.message = document.getElementById('main-message');

                this.noise = new OrganicNoise();
                this.time = 0;
                this.lastTimestamp = 0;

                this.bloom = 0;
                this.growth = 0;
                this.windForce = 0;

                this.targetBloom = 0;
                this.targetGrowth = 0;
                this.targetWindForce = 0;

                this.prevHandX = 0.5;
                this.handLandmarks = [];
                this.handHandedness = [];
                this.particles = [];

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.initParticles();
                
                // Audio Context Unlock
                this.startBtn.addEventListener('click', () => {
                    if (this.music) {
                        this.music.volume = 0.85;
                        const playPromise = this.music.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                console.log("Audio playing successfully");
                            }).catch(err => {
                                console.warn("Audio play prevented:", err);
                                const enableAudio = () => {
                                    this.music.play();
                                    document.removeEventListener('click', enableAudio);
                                    document.removeEventListener('touchstart', enableAudio);
                                };
                                document.addEventListener('click', enableAudio);
                                document.addEventListener('touchstart', enableAudio);
                            });
                        }
                    }
                    this.initHandTracking();
                });

                requestAnimationFrame((ts) => this.animate(ts));
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                for (const p of this.particles) {
                    p.cw = this.canvas.width;
                    p.ch = this.canvas.height;
                }
            }

            initParticles() {
                for (let i = 0; i < 80; i++) {
                    this.particles.push(new Particle(this.canvas.width, this.canvas.height));
                }
            }

            initHandTracking() {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.65,
                    minTrackingConfidence: 0.5,
                });

                hands.onResults((r) => this.onHandResults(r));

                const cam = new Camera(this.video, {
                    onFrame: async () => {
                        await hands.send({ image: this.video });
                    },
                    width: 1280,
                    height: 720,
                });

                cam.start().then(() => {
                    this.startOverlay.style.display = 'none';
                }).catch(err => {
                    alert("Camera access failed. Please ensure camera permissions are allowed.");
                });
            }

            calcPinchDistance(lm) {
                const thumb = lm[4];
                const index = lm[8];
                const wrist = lm[0];
                const mcp = lm[9];

                const ref = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
                if (ref < 0.01) return 0;

                const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                return Math.min(1, Math.max(0, (dist / ref - 0.15) * 1.6));
            }

            palmCenter(lm) {
                const ids = [0, 5, 9, 13, 17];
                let x = 0, y = 0;
                for (const i of ids) { x += lm[i].x; y += lm[i].y; }
                return { x: x / ids.length, y: y / ids.length };
            }

            onHandResults(results) {
                this.handLandmarks = results.multiHandLandmarks || [];
                this.handHandedness = results.multiHandedness || [];
                const detected = this.handLandmarks.length;

                let leftPinch = 0, rightPinch = 0;
                let hasLeft = false, hasRight = false;

                if (detected > 0) {
                    for (let i = 0; i < detected; i++) {
                        const hand = this.handLandmarks[i];
                        const handedness = results.multiHandedness[i];
                        const isLeft = handedness && handedness.label === 'Left';
                        const pinch = this.calcPinchDistance(hand);

                        if (isLeft) {
                            leftPinch = pinch;
                            hasLeft = true;
                        } else {
                            rightPinch = pinch;
                            hasRight = true;
                        }

                        const c = this.palmCenter(hand);
                        const dx = c.x - this.prevHandX;
                        // GREATLY REDUCED WIND SENSITIVITY HERE
                        this.targetWindForce = dx * 10;
                        this.prevHandX = c.x;
                    }

                    this.targetBloom = hasLeft ? leftPinch : 0;
                    this.targetGrowth = hasRight ? rightPinch : 0;
                } else {
                    this.targetBloom *= 0.94;
                    this.targetGrowth *= 0.94;
                    // FASTER WIND DECAY WHEN HANDS ARE OFF SCREEN
                    this.targetWindForce *= 0.7;
                }
            }

            drawHandSkeleton(lm, handedness) {
                const ctx = this.ctx;
                const cw = this.canvas.width;
                const ch = this.canvas.height;

                const thumbTip = lm[4];
                const indexTip = lm[8];
                if (thumbTip && indexTip) {
                    const tx = thumbTip.x * cw;
                    const ty = thumbTip.y * ch;
                    const ix = indexTip.x * cw;
                    const iy = indexTip.y * ch;

                    const isLeft = handedness && handedness.label === 'Left';
                    const labelText = isLeft ? '🌸 Left: Bloom' : '🌱 Right: Grow';
                    const glowColor = isLeft ? 'rgba(217, 70, 239, 0.9)' : 'rgba(168, 85, 247, 0.9)';
                    const strokeStyle = isLeft ? '#d946ef' : '#a855f7';

                    ctx.save();
                    ctx.setLineDash([4, 4]);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = strokeStyle;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = glowColor;
                    ctx.beginPath();
                    ctx.moveTo(tx, ty);
                    ctx.lineTo(ix, iy);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = glowColor;
                    ctx.fillStyle = strokeStyle;
                    ctx.beginPath();
                    ctx.arc(tx, ty, 6, 0, Math.PI * 2);
                    ctx.arc(ix, iy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    const midX = (tx + ix) / 2;
                    const midY = (ty + iy) / 2;

                    ctx.save();
                    ctx.translate(cw, 0);
                    ctx.scale(-1, 1);

                    ctx.font = 'bold 12px Inter, sans-serif';
                    const textWidth = ctx.measureText(labelText).width;
                    const pillWidth = textWidth + 20;
                    const pillHeight = 22;
                    const drawX = cw - midX;
                    const drawY = midY - 20;

                    ctx.fillStyle = 'rgba(10, 5, 20, 0.85)';
                    ctx.strokeStyle = strokeStyle;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(drawX - pillWidth / 2, drawY - pillHeight / 2, pillWidth, pillHeight, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(labelText, drawX, drawY);
                    ctx.restore();
                }
            }

            drawStem(baseX, baseY, height, windAngle, phaseOffset) {
                const ctx = this.ctx;
                const segs = 24;
                const segH = height / segs;
                const pts = [{ x: baseX, y: baseY }];

                for (let i = 1; i <= segs; i++) {
                    const t = i / segs;
                    // REDUCED STEM WIND BENDING HERE
                    const windBend = windAngle * t * t * 40;
                    const sway = this.noise.get(this.time * 0.8 + i * 0.25 + phaseOffset, 0) * 10 * t;
                    pts.push({ x: baseX + windBend + sway, y: baseY - segH * i });
                }

                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.lineWidth = 8;
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.25)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(192, 132, 252, 0.5)';
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#2e7d32';
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();

                this.drawLeaves(pts, phaseOffset);
                ctx.restore();
                return { tip: pts[pts.length - 1], pts };
            }

            drawLeaves(stemPts, phaseOffset) {
                const ctx = this.ctx;
                const positions = [0.25, 0.45, 0.65];
                for (let li = 0; li < positions.length; li++) {
                    const idx = Math.floor(positions[li] * (stemPts.length - 1));
                    const pt = stemPts[idx];
                    const side = li % 2 === 0 ? 1 : -1;
                    const len = 25 + this.growth * 20;
                    const angle = side * (0.45 + this.noise.get(this.time * 0.6 + li * 3 + phaseOffset, 2) * 0.15);

                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(angle);

                    const grad = ctx.createLinearGradient(0, 0, len, 0);
                    grad.addColorStop(0, 'rgba(46, 125, 50, 0.9)');
                    grad.addColorStop(1, 'rgba(129, 199, 132, 0.4)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(len * 0.5, -12, len, -1);
                    ctx.quadraticCurveTo(len * 0.5, 12, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
            }

            drawFlowerHead(cx, cy, bloom, windAngle, scale, phaseOffset) {
                const adjustedScale = scale * (1.0 + bloom * 0.22);
                const ctx = this.ctx;

                ctx.save();
                ctx.translate(cx, cy);

                const glowR = (80 + bloom * 160) * adjustedScale;
                if (bloom > 0.02) {
                    const glow = ctx.createRadialGradient(0, -glowR * 0.4, 0, 0, -glowR * 0.4, glowR);
                    glow.addColorStop(0, `rgba(192, 132, 252, ${0.65 * bloom})`);
                    glow.addColorStop(0.4, `rgba(147, 51, 234, ${0.35 * bloom})`);
                    glow.addColorStop(1, 'rgba(88, 28, 135, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(0, -glowR * 0.4, glowR, 0, Math.PI * 2);
                    ctx.fill();
                }

                const hue = 285;
                const sat = 90;
                const light = 48;

                const backPetals = [
                    { angle: 0, lengthMul: 1.1, widthMul: 0.5, hueOffset: 0, lightOffset: -6 },
                    { angle: -0.2 - bloom * 0.75, lengthMul: 1.0, widthMul: 0.48, hueOffset: 12, lightOffset: -3 },
                    { angle: 0.2 + bloom * 0.75, lengthMul: 1.0, widthMul: 0.48, hueOffset: 12, lightOffset: -3 }
                ];

                const frontPetals = [
                    { angle: -0.08 - bloom * 0.6, lengthMul: 0.95, widthMul: 0.45, hueOffset: 6, lightOffset: 4 },
                    { angle: 0.08 + bloom * 0.6, lengthMul: 0.95, widthMul: 0.45, hueOffset: 6, lightOffset: 4 },
                    { angle: 0, lengthMul: 0.88, widthMul: 0.42, hueOffset: -8, lightOffset: 8 }
                ];

                const maxPetalLen = 95 * adjustedScale;

                for (const p of backPetals) {
                    const flutter = this.noise.get(this.time * 1.2 + p.angle * 10 + phaseOffset, 3) * 0.05 * (1 + bloom);
                    this.drawTulipPetal(ctx, p.angle + flutter + windAngle * 0.1, maxPetalLen * p.lengthMul, maxPetalLen * p.widthMul * (0.65 + bloom * 0.85), hue + p.hueOffset, sat, light + p.lightOffset, bloom);
                }

                if (bloom > 0.15) {
                    ctx.save();
                    ctx.fillStyle = `rgba(233, 213, 255, ${bloom})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#e9d5ff';
                    ctx.beginPath();
                    ctx.arc(0, -maxPetalLen * 0.22, 6 * adjustedScale, 0, Math.PI * 2);
                    ctx.fill();

                    for (let i = 0; i < 5; i++) {
                        const a = (i / 5) * Math.PI * 2 + this.time * 0.5 + phaseOffset;
                        const r = 9 * adjustedScale * bloom;
                        const sx = Math.cos(a) * r;
                        const sy = -maxPetalLen * 0.22 + Math.sin(a) * r;

                        ctx.strokeStyle = `rgba(216, 180, 254, ${bloom * 0.8})`;
                        ctx.lineWidth = 1.8 * adjustedScale;
                        ctx.beginPath();
                        ctx.moveTo(0, -maxPetalLen * 0.1);
                        ctx.lineTo(sx, sy);
                        ctx.stroke();

                        ctx.fillStyle = `rgba(255, 235, 120, ${bloom})`;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 3 * adjustedScale, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                for (const p of frontPetals) {
                    const flutter = this.noise.get(this.time * 1.4 + p.angle * 10 + phaseOffset, 4) * 0.04 * (1 + bloom);
                    this.drawTulipPetal(ctx, p.angle + flutter + windAngle * 0.05, maxPetalLen * p.lengthMul, maxPetalLen * p.widthMul * (0.7 + bloom * 0.8), hue + p.hueOffset, sat, light + p.lightOffset, bloom);
                }

                ctx.restore();
            }

            drawTulipPetal(ctx, angle, length, width, hue, sat, light, bloom) {
                ctx.save();
                ctx.rotate(angle);

                const grad = ctx.createLinearGradient(0, 0, 0, -length);
                grad.addColorStop(0, `hsla(${hue + 20}, ${sat}%, ${light - 10}%, 0.95)`);
                grad.addColorStop(0.35, `hsla(${hue}, ${sat}%, ${light}%, 0.9)`);
                grad.addColorStop(0.8, `hsla(${hue - 15}, ${sat + 10}%, ${light + 14}%, 0.9)`);
                grad.addColorStop(1, `hsla(${hue - 25}, ${sat + 15}%, ${light + 22}%, 0.98)`);

                ctx.fillStyle = grad;
                ctx.shadowBlur = 18 + bloom * 25;
                ctx.shadowColor = `hsla(${hue}, 100%, 68%, ${0.4 + bloom * 0.55})`;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-width * 1.25, -length * 0.32, -width * 0.95, -length * 0.88, 0, -length);
                ctx.bezierCurveTo(width * 0.95, -length * 0.88, width * 1.25, -length * 0.32, 0, 0);
                ctx.fill();
                ctx.restore();
            }

            drawBranch(startX, startY, baseAngle, length, windAngle, scale, phaseOffset) {
                const ctx = this.ctx;
                const segs = 12;
                const segL = length / segs;
                const pts = [{ x: startX, y: startY }];

                for (let i = 1; i <= segs; i++) {
                    const t = i / segs;
                    const windBend = windAngle * t * t * 15;
                    const sway = this.noise.get(this.time * 0.8 + i * 0.3 + phaseOffset, 5) * 5 * t;
                    const angle = baseAngle + windBend * 0.02 + sway * 0.01;
                    pts.push({
                        x: pts[pts.length - 1].x + Math.cos(angle) * segL + windBend * 0.3,
                        y: pts[pts.length - 1].y + Math.sin(angle) * segL
                    });
                }

                ctx.save();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = '#2e7d32';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.4)';
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();
                ctx.restore();

                return pts[pts.length - 1];
            }

            drawHUD() {
                const ctx = this.ctx;
                const cw = this.canvas.width;

                ctx.save();
                ctx.translate(cw, 0);
                ctx.scale(-1, 1);

                ctx.font = '600 14px Inter, sans-serif';
                const px = 20, py = 25;

                ctx.fillStyle = 'rgba(10, 5, 20, 0.5)';
                ctx.beginPath();
                ctx.roundRect(px - 10, py - 14, 138, 78, 10);
                ctx.fill();

                ctx.fillStyle = 'rgba(232, 121, 249, 0.95)';
                ctx.fillText(`Bloom: ${this.bloom.toFixed(2)}`, px, py + 6);

                ctx.fillStyle = 'rgba(192, 132, 252, 0.95)';
                ctx.fillText(`Grow: ${this.growth.toFixed(2)}`, px, py + 28);

                ctx.fillStyle = 'rgba(147, 197, 253, 0.95)';
                ctx.fillText(`Wind: ${this.windForce.toFixed(2)}`, px, py + 50);

                ctx.restore();
            }

            animate(timestamp) {
                const dt = this.lastTimestamp ? (timestamp - this.lastTimestamp) / 16.67 : 1;
                this.lastTimestamp = timestamp;
                this.time += 0.016 * dt;

                const ctx = this.ctx;
                const cw = this.canvas.width;
                const ch = this.canvas.height;

                const lerpSpeed = 0.08 * dt;
                this.bloom += (this.targetBloom - this.bloom) * lerpSpeed;
                this.growth += (this.targetGrowth - this.growth) * 0.05 * dt;
                this.windForce += (this.targetWindForce - this.windForce) * 0.12 * dt;

                const naturalWind = this.noise.get(this.time * 0.7, 1) * 0.1;
                // REDUCED TOTAL WIND MULTIPLIER HERE
                const totalWind = naturalWind + this.windForce * 0.12;

                ctx.clearRect(0, 0, cw, ch);

                for (let i = 0; i < this.handLandmarks.length; i++) {
                    this.drawHandSkeleton(this.handLandmarks[i], this.handHandedness[i]);
                }

                for (const p of this.particles) {
                    p.update(totalWind, dt);
                    p.draw(ctx);
                }

                if (this.growth > 0.005) {
                    // 4 INDEPENDENT FLOWERS
                    const fieldConfig = [
                        { baseX: cw * 0.15, baseY: ch * 1.05, heightFactor: 0.45, scaleFactor: 1.0, phaseOffset: 0 },
                        { baseX: cw * 0.38, baseY: ch * 0.95, heightFactor: 0.55, scaleFactor: 1.3, phaseOffset: 10 },
                        { baseX: cw * 0.65, baseY: ch * 1.0,  heightFactor: 0.48, scaleFactor: 1.1, phaseOffset: 5 },
                        { baseX: cw * 0.88, baseY: ch * 0.98, heightFactor: 0.50, scaleFactor: 1.2, phaseOffset: 15 }
                    ];

                    for (const plant of fieldConfig) {
                        const stemH = ch * plant.heightFactor * this.growth;
                        const flowerScale = plant.scaleFactor * this.growth;

                        const stemData = this.drawStem(plant.baseX, plant.baseY, stemH, totalWind, plant.phaseOffset);
                        const tip = stemData.tip;
                        const pts = stemData.pts;

                        const branchConfigs = [
                            { heightRatio: 0.4, direction: -1, lengthFactor: 0.12, scaleFactor: 0.4 },
                            { heightRatio: 0.6, direction: 1, lengthFactor: 0.11, scaleFactor: 0.42 }
                        ];

                        for (const config of branchConfigs) {
                            const idx = Math.floor(pts.length * config.heightRatio);
                            if (idx > 0 && idx < pts.length) {
                                const pt = pts[idx];
                                const prevPt = pts[idx - 1] || pt;
                                const tangent = Math.atan2(pt.y - prevPt.y, pt.x - prevPt.x);
                                const branchAngle = tangent + (config.direction * 0.75);
                                const branchLength = ch * config.lengthFactor * this.growth;
                                const branchTip = this.drawBranch(pt.x, pt.y, branchAngle, branchLength, totalWind, this.growth, plant.phaseOffset);
                                
                                this.drawFlowerHead(branchTip.x, branchTip.y, this.bloom, totalWind, flowerScale * config.scaleFactor, plant.phaseOffset);
                            }
                        }

                        this.drawFlowerHead(tip.x, tip.y, this.bloom, totalWind, flowerScale, plant.phaseOffset);
                    }
                }

                if (this.bloom > 0.60) {
                    this.message.classList.add('revealed');
                } else {
                    this.message.classList.remove('revealed');
                }

                this.drawHUD();
                requestAnimationFrame((ts) => this.animate(ts));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new FlowerBloomApp();
        });
    </script>
</body>
</html>
