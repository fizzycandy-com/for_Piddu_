<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const hud = document.getElementById('hud');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const music = document.getElementById('bg-music');
    
    const tulipBg = document.getElementById('hd-tulip-bg');
    const tiara = document.getElementById('princess-tiara');
    const message = document.getElementById('main-message');

    let bloomFactor = 0;

    // Standard Normalized Distance
    function getDistance(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function animateFilters(factor) {
      const blurVal = (1 - factor) * 12;
      const saturationVal = 0.1 + (factor * 1.7);
      const brightnessVal = 0.3 + (factor * 0.7);

      tulipBg.style.filter = `blur(${blurVal}px) saturate(${saturationVal}) brightness(${brightnessVal})`;
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Key Landmarks
        const wrist = landmarks[0];
        const middleMCP = landmarks[9]; // Middle finger knuckle
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];

        // 1. Calculate Palm Scale (Wrist to Middle Knuckle)
        const handScale = getDistance(wrist, middleMCP);

        // 2. Calculate Pinch/Spread Distance
        const pinchDist = getDistance(thumbTip, indexTip);

        // 3. Normalize: Ratio of pinch distance to palm size
        // Closed pinch ~ 0.15 to 0.2, Spreading fingers ~ 0.8+
        const ratio = pinchDist / (handScale || 1);

        const minRatio = 0.2;
        const maxRatio = 0.75;

        const rawFactor = (ratio - minRatio) / (maxRatio - minRatio);
        bloomFactor = Math.min(Math.max(rawFactor, 0), 1);
      }

      const percent = Math.round(bloomFactor * 100);
      hud.innerText = `Bloom: ${percent}%`;
      animateFilters(bloomFactor);

      // Reveal tiara and message once bloom reaches 70%
      if (bloomFactor > 0.70) {
        tiara.classList.add('revealed');
        message.classList.add('revealed');
      } else {
        tiara.classList.remove('revealed');
        message.classList.remove('revealed');
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    startBtn.addEventListener('click', () => {
      music.play().catch(e => console.log("Audio play deferred or file missing"));

      camera.start()
        .then(() => {
          startOverlay.style.display = 'none';
        })
        .catch(err => {
          alert("Camera access denied or failed to load. Please verify camera permissions.");
        });
    });
  </script>
